name: Rules job search

on:
  schedule:
    # Every 15 minutes as a backup; the "again" job keeps it running nonstop.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Never run two copies of the same search at once.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.clock.outputs.go }}
    steps:
      - id: clock
        run: |
          echo "go=yes" >> "$GITHUB_OUTPUT"

  # The two searches run side by side, each with its own time limit, so a slow
  # or stuck one can never hold the other up.
  uk-communities:
    needs: clock
    if: needs.clock.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: search
        name: Search UK communities against the user's rules
        timeout-minutes: 25
        env:
          TRIED_VTCS: ${{ secrets.TRIED_VTCS }}
        run: node rules-search.mjs
      - name: Post the results as an issue
        if: steps.search.outputs.blocked != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.search.outputs.body }}
          COUNT: ${{ steps.search.outputs.count }}
          STEP: ${{ steps.search.outputs.step }}
        run: |
          printf '%s\n' "$BODY" > rules-body.md
          bash .github/post-latest.sh "UK VTC search" "$COUNT found, $STEP+ staff" rules-body.md

  app-projects:
    needs: clock
    if: needs.clock.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: apps
        name: Search open-source app projects
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: node app-search.mjs
      - name: Post the app projects as an issue
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.apps.outputs.body }}
          COUNT: ${{ steps.apps.outputs.count }}
        run: |
          printf '%s\n' "$BODY" > app-body.md
          bash .github/post-latest.sh "App project search" "$COUNT found" app-body.md

  # Four GitHub computers search at once, each taking a quarter of the
  # searches at the widest level; a fifth combines and posts the results.
  communities:
    needs: clock
    if: needs.clock.outputs.go == 'yes' && vars.COMMUNITY_SEARCH != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests (each role, English check, CLA rule)
        run: node --test tests/roles.test.mjs tests/english.test.mjs tests/cla.test.mjs tests/no-broken-characters.test.mjs
      - name: Search a quarter of the communities
        timeout-minutes: 30
        env:
          WIDEN: 2
          SHARD: ${{ matrix.shard }}
          SHARDS: 6
          COLLECT_ONLY: found-${{ matrix.shard }}.json
        run: node community-search.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: found-${{ matrix.shard }}
          path: found-${{ matrix.shard }}.json

  communities-post:
    needs: communities
    permissions:
      contents: write
      issues: write
    if: always() && needs.communities.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: found
      - id: comm
        name: Combine and apply the rules
        env:
          TRIED_VTCS: ${{ secrets.TRIED_VTCS }}
          WIDEN: 2
          MERGE: found
        run: node community-search.mjs > /dev/null
      - name: Post the communities as an issue
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.comm.outputs.body }}
          HIRING: ${{ steps.comm.outputs.hiring }}
        run: |
          printf '%s\n' "$BODY" > comm-body.md
          bash .github/post-latest.sh "Community search" "$HIRING hiring" comm-body.md
      - name: If nothing was found, get help (Claude next session, another AI right now)
        if: steps.comm.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node stuck-help.mjs "Community search"

  # Runs all the time: as soon as one search finishes, use the break to feed in
  # NEW leads (lead-feeder.mjs), then start the next search with them.
  # (The 15-minute schedule above is a backup in case this chain ever stops.)
  again:
    needs: [uk-communities, app-projects, communities-post]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Break time - feed in new leads
        timeout-minutes: 10
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node lead-feeder.mjs
      - name: Start the next search
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub skips timed runs when it's busy (the finders went 4+ hours without
        # running on 10 Oct), so this chain starts them too.
        run: |
          gh workflow run rules-search.yml --repo "$GITHUB_REPOSITORY"
          gh workflow run find-jobs.yml --repo "$GITHUB_REPOSITORY" || true
          gh workflow run find-vtcs.yml --repo "$GITHUB_REPOSITORY" || true
