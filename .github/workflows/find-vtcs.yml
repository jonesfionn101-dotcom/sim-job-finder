name: Find recruiting VTCs

on:
  schedule:
    # Every 3 hours, day and night.
    - cron: "5-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Never run two copies of the same search at once.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    # Never let a stuck run hang until GitHub kills it after 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - id: finder
        name: Check which VTCs have recruitment open
        env:
          TRIED_VTCS: ${{ secrets.TRIED_VTCS }}
        run: node vtc-finder.mjs

      - name: Post the shortlist as an issue
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.finder.outputs.body }}
          COUNT: ${{ steps.finder.outputs.count }}
        run: |
          printf '%s\n' "$BODY" > vtc-body.md
          bash .github/post-latest.sh "VTC shortlist" "$COUNT recruiting" vtc-body.md
